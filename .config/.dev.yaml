MONGODB_CONFIG:
  name: "ignition_test"              # 自定义次数据库链接名称
  type: mongodb                      # 数据库链接类型
  url: "mongodb://localhost:27017"   # 数据库链接地址
  username: "root"                   # 数据库链接用户名
  password: "123456"                 # 数据库链接密码
  database: "fast_gateway_test"      # 数据库名
  entities: "mongo"                  # 自定义对实体类的加载类型
  logging: true                     # 数据库打印日志
  synchronize: true                  # 每一次启动是否开启同步数据表功能
MYSQL_CONFIG:
  name: "my-lowcode"
  type: "mysql"
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "123456"
  database: "my_test_database"
  entities: "mysql"
  logging: true
  synchronize: true
  cache: true
